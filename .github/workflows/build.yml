name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build